[workspace]
resolver = "3"
members = ["bridge/crates/*", "shared/generated/rust"]
default-members = ["bridge/crates/bridge-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
authors = ["YM Connect contributors"]
repository = "https://github.com/Azizbek2727/YM-Connect"
homepage = "https://github.com/Azizbek2727/YM-Connect"
readme = "README.md"

[workspace.dependencies]
chacha20poly1305 = "=0.11.0"
ed25519-dalek = "=3.0.0"
hkdf = "=0.13.0"
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "signal"] }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
ym-connect-bridge-core = { version = "=0.1.0", path = "bridge/crates/bridge-core" }
ym-connect-protocol = { version = "=0.1.0", path = "shared/generated/rust" }
zeroize = { version = "=1.9.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
multiple_crate_versions = "allow"
module_name_repetitions = "allow"

[profile.dev]
debug = 1

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "fat"
