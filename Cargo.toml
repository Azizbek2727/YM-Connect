[workspace]
resolver = "3"
members = ["bridge/crates/*", "shared/generated/rust"]
default-members = ["bridge/crates/bridge-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
authors = ["YM Connect contributors"]
repository = "https://github.com/Azizbek2727/YM-Connect"
homepage = "https://github.com/Azizbek2727/YM-Connect"
readme = "README.md"

[workspace.dependencies]
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["zeroize"] }
hkdf = { version = "=0.12.4", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "signal"] }
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "=1.8.2", default-features = false }
ym-connect-bridge-core = { version = "=0.1.0", path = "bridge/crates/bridge-core" }
ym-connect-protocol = { version = "=0.1.0", path = "shared/generated/rust" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
multiple_crate_versions = "allow"
module_name_repetitions = "allow"

[profile.dev]
debug = 1

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "fat"
