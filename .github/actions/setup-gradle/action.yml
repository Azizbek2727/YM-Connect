# cspell:words anchore attest attestations bufbuild codeql dependabot macos notarization openssf playwright protoc sarif sbom scorecard spdx syft temurin webkit x86
name: Setup Java and Gradle
description: Install Java 17 and configure verified Gradle wrapper execution.
runs:
  using: composite
  steps:
    - name: Install Java 17
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        distribution: temurin
        java-version: "17"
    - name: Configure Gradle
      uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
      with:
        validate-wrappers: true
