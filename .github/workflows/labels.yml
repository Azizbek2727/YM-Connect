name: Repository Labels

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.json"
      - ".github/scripts/sync-labels.mjs"
      - ".github/workflows/labels.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
        with:
          install: "false"
      - name: Synchronize repository labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-labels.mjs
