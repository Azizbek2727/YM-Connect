name: Repository Labels

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.json"
      - ".github/scripts/sync-labels.mjs"
      - ".github/workflows/labels.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-node
        with:
          install: "false"
      - name: Synchronize repository labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-labels.mjs
