name: Discovery Export Bootstrap

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/discovery-export-bootstrap

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 785325a526b4841f5d9d5fbe60c36fb140442640
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - name: Validate Bridge Rust formatting
        run: cargo fmt --all -- --check
      - name: Validate patch whitespace
        run: git diff --check 7df56767c12e97fe27300f9805fcb30ecdbbf8f1...785325a526b4841f5d9d5fbe60c36fb140442640
