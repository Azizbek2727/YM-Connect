name: Discovery Export Bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-canonical-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: c4d5dba4d2382b89d39783f5dc8ee87778a2f173
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - name: Canonicalize and validate
        shell: bash
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          git diff --check 7df56767c12e97fe27300f9805fcb30ecdbbf8f1
      - name: Publish canonical tree object
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "chore(ci): materialize discovery canonical tree"
          git push --force origin HEAD:agent/discovery-canonical-tree
          git rev-parse HEAD^{tree}
