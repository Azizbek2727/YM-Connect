name: Discovery Export Bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 759d8148964cb119db684af002c28769ebfaf66e
          fetch-depth: 0
      - name: Report final tree
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
