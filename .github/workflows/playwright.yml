# cspell:words anchore attest attestations bufbuild codeql dependabot macos notarization openssf playwright protoc sarif sbom scorecard spdx syft temurin webkit x86
name: Playwright

on:
  pull_request:
    paths:
      - "extension/**"
      - "shared/generated/typescript/**"
      - "shared/packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/playwright.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-node
      - id: components
        run: node .github/scripts/component-status.mjs
      - name: Record unavailable Playwright suite
        if: steps.components.outputs.playwright != 'true'
        run: echo "The Extension has not introduced its Playwright configuration in this staged repository revision."
      - name: Install Playwright browsers
        if: steps.components.outputs.playwright == 'true'
        run: pnpm --dir extension exec playwright install --with-deps
      - name: Run JavaScript tests including Playwright
        if: steps.components.outputs.playwright == 'true'
        run: pnpm test:js
      - name: Upload Playwright report
        if: always() && steps.components.outputs.playwright == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            extension/playwright-report
            extension/test-results
          if-no-files-found: ignore
          retention-days: 14
