# cspell:words anchore attest attestations bufbuild codeql dependabot macos notarization openssf playwright protoc sarif sbom scorecard spdx syft temurin webkit x86
name: Supply Chain

on:
  push:
    branches: [main]
  schedule:
    - cron: "31 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-node
      - name: Verify immutable automation and lockfiles
        run: |
          node .github/scripts/verify-workflow-pins.mjs
          node .github/scripts/verify-lockfiles.mjs
          node .github/scripts/verify-official-protobuf-es.mjs
      - name: Verify frozen dependency resolution
        run: git diff --exit-code -- pnpm-lock.yaml Cargo.lock gradle/verification-metadata.xml
      - name: Generate source SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ym-connect-source.spdx.json
          upload-artifact: false
          dependency-snapshot: true
      - name: Validate SBOM JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('ym-connect-source.spdx.json','utf8'))"
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-sbom
          path: ym-connect-source.spdx.json
          retention-days: 30

  scorecard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecard-results.sarif
