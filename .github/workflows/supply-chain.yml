# cspell:words anchore attest attestations bufbuild codeql dependabot macos notarization openssf playwright protoc sarif sbom scorecard spdx syft temurin webkit x86
name: Supply Chain

on:
  push:
    branches: [main]
  schedule:
    - cron: "31 4 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  security-events: write

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-node
      - name: Verify immutable automation and lockfiles
        run: |
          node .github/scripts/verify-workflow-pins.mjs
          node .github/scripts/verify-lockfiles.mjs
          node .github/scripts/verify-official-protobuf-es.mjs
      - name: Verify frozen dependency resolution
        run: git diff --exit-code -- pnpm-lock.yaml Cargo.lock gradle/verification-metadata.xml
      - name: Generate source SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          path: .
          format: spdx-json
          output-file: ym-connect-source.spdx.json
          upload-artifact: false
          dependency-snapshot: true
      - name: Validate SBOM JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('ym-connect-source.spdx.json','utf8'))"
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-sbom
          path: ym-connect-source.spdx.json
          retention-days: 30

  scorecard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard results
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: scorecard-results.sarif
