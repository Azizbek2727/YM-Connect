# cspell:words anchore attest attestations bufbuild codeql dependabot macos notarization openssf playwright protoc sarif sbom scorecard spdx syft temurin webkit x86
name: Artifact Verification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify.
        required: true
  workflow_call:
    inputs:
      tag:
        description: Published release tag to verify.
        required: true
        type: string

permissions:
  contents: read
  attestations: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}
      - uses: ./.github/actions/setup-node
        with:
          install: "false"
      - name: Validate tag and repository version
        run: node .github/scripts/validate-release-tag.mjs ${{ inputs.tag }}
      - name: Download published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" --dir release
      - name: Verify SHA-256 manifest
        run: node .github/scripts/verify-checksums.mjs release
      - name: Validate SBOM documents
        run: |
          node --input-type=module -e "import { readFile, readdir } from 'node:fs/promises'; const files=(await readdir('release')).filter((name)=>name.endsWith('.spdx.json')); if(files.length===0) throw new Error('Release SBOM is missing'); for(const file of files) JSON.parse(await readFile('release/'+file,'utf8'));"
      - name: Verify GitHub attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find release -type f ! -name 'SHA256SUMS' ! -name 'SHA256SUMS.sig' ! -name 'SHA256SUMS.pem' -print0 | while IFS= read -r -d '' file; do
            gh attestation verify "$file" --repo "${{ github.repository }}"
          done
      - name: Upload verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-${{ inputs.tag }}
          path: release
          retention-days: 14
