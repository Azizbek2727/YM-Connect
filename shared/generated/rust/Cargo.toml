[package]
name = "ym-connect-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
description = "Canonical generated Protocol Buffer models for YM Connect."
publish = false

[dependencies]
prost = { version = "=0.14.4", default-features = false, features = ["derive", "std"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
enum_variant_names = "allow"
large_enum_variant = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
