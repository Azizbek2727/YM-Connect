syntax = "proto3";

package ymconnect.v1;

option java_package = "ymconnect.v1";
option java_outer_classname = "Errors";
option java_multiple_files = false;
option optimize_for = LITE_RUNTIME;

enum ErrorDomain {
  ERROR_DOMAIN_UNSPECIFIED = 0;
  ERROR_DOMAIN_PROTOCOL = 1;
  ERROR_DOMAIN_VALIDATION = 2;
  ERROR_DOMAIN_AUTHENTICATION = 3;
  ERROR_DOMAIN_AUTHORIZATION = 4;
  ERROR_DOMAIN_TRANSPORT = 5;
  ERROR_DOMAIN_DISCOVERY = 6;
  ERROR_DOMAIN_PAIRING = 7;
  ERROR_DOMAIN_TRUST = 8;
  ERROR_DOMAIN_CONNECTOR = 9;
  ERROR_DOMAIN_PLAYER = 10;
  ERROR_DOMAIN_COMMAND = 11;
  ERROR_DOMAIN_PLATFORM = 12;
  ERROR_DOMAIN_INTERNAL = 13;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_MALFORMED_MESSAGE = 1;
  ERROR_CODE_UNSUPPORTED_PROTOCOL = 2;
  ERROR_CODE_INCOMPATIBLE_CAPABILITIES = 3;
  ERROR_CODE_MESSAGE_TOO_LARGE = 4;
  ERROR_CODE_RATE_LIMITED = 5;
  ERROR_CODE_REPLAY_DETECTED = 6;
  ERROR_CODE_SEQUENCE_GAP = 7;
  ERROR_CODE_CLOCK_SKEW = 8;
  ERROR_CODE_AUTHENTICATION_FAILED = 9;
  ERROR_CODE_AUTHORIZATION_DENIED = 10;
  ERROR_CODE_PAIRING_EXPIRED = 11;
  ERROR_CODE_PAIRING_REJECTED = 12;
  ERROR_CODE_TRUST_REVOKED = 13;
  ERROR_CODE_SESSION_EXPIRED = 14;
  ERROR_CODE_SESSION_NOT_FOUND = 15;
  ERROR_CODE_CONNECTOR_UNAVAILABLE = 16;
  ERROR_CODE_CONNECTOR_REJECTED = 17;
  ERROR_CODE_PLAYER_NOT_FOUND = 18;
  ERROR_CODE_PLAYER_NOT_READY = 19;
  ERROR_CODE_COMMAND_UNSUPPORTED = 20;
  ERROR_CODE_COMMAND_CONFLICT = 21;
  ERROR_CODE_COMMAND_TIMEOUT = 22;
  ERROR_CODE_PLATFORM_FAILURE = 23;
  ERROR_CODE_INTERNAL_FAILURE = 24;
}

message ProtocolError {
  ErrorDomain domain = 1;
  ErrorCode code = 2;
  string message = 3;
  bool retryable = 4;
  uint64 retry_after_ms = 5;
  map<string, string> metadata = 6;
}
